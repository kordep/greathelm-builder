er-spacing:.25px;margin:0 0 1mm;color:black}.ref-paper .ref-card h3{font:bold 11.5pt/1.15 Georgia,serif;margin:0 0 1.5mm;padding-bottom:1mm;border-bottom:1px solid black}.ref-paper .ref-card table th,.ref-paper .ref-card table td{font:var(--ref-size)/1.23 Georgia,serif;padding:.75mm 1mm;border-bottom:.4px solid #888;color:black}.ref-paper .ref-card table tbody th{font-weight:bold;hyphens:auto}.ref-paper .ref-card table th:first-child{width:31%}.ref-paper .ref-card table:has(thead th:nth-child(3)) th:first-child{width:12%}.ref-paper .ref-card table thead th{font:bold 8pt/1.2 Georgia,serif;padding:.7mm 1mm;border-bottom:.6px solid #555}.ref-paper .ref-note{font:9pt/1.23 Georgia,serif;margin:1.5mm 0 0;padding:1mm 0 0;border-top:.5px solid #777;color:black}.ref-column{width:92mm;height:257mm;flex-shrink:0;display:flex;flex-direction:column;gap:9px}.ref-column>.ref-card{flex-shrink:0}.ref-measure{position:fixed;left:-10000px;top:0;visibility:hidden;width:92mm;pointer-events:none}.ref-sheet{width:210mm;height:296.8mm;padding:10mm;display:flex;flex-direction:column;box-sizing:border-box;margin:0}.ref-page-head{height:9mm;flex-shrink:0;display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:3mm;border-bottom:1px solid black;font:8pt/1.2 Georgia,serif}.ref-page-head>strong{font:16pt/1 Georgia,serif;white-space:nowrap}.ref-page-head strong span{font:9pt Georgia,serif;margin-left:3mm}.ref-page-columns{display:flex;gap:6mm;flex-shrink:0}.ref-page-foot{height:7mm;margin-top:auto;display:flex;align-items:end;justify-content:space-between;gap:10px;font:8pt/1.2 Georgia,serif;border-top:.5px solid #777;padding-top:1mm;flex-shrink:0}#table-print-root{display:none}.tables-preview #app{display:none}.tables-preview #table-print-root{display:block;max-width:100%;overflow-x:auto;padding:18px}.tables-preview .ref-sheet{margin:0 auto 18px;box-shadow:0 3px 18px #0002}.tables-preview #print-controls{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:14 .ref-usage-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.ref-usage-tabs button.active{background:var(--blue);color:var(--sheet);border-color:var(--blue)}.ref-usage-group{margin:28px 0}.ref-usage-group>h2{border-bottom:3px double var(--line);padding-bottom:12px}.ref-usage-group>h2 small{font-size:15px;color:var(--muted)}.play-actions{margin:24px 0}.play-actions>.ref-card{background:var(--sheet);padding:22px;border:1px solid var(--gold)}.play-actions .ref-card table th:first-child{width:75px;text-align:center}.play-actions .ref-card tbody th{font-size:22px}.play-actions .ref-card table td{font-size:15px}.play-actions .ref-card tbody tr:last-child th{font-size:12px;line-height:1.4;overflow-wrap:normal}
@media(max-width:950px){.ref-toolbar{grid-template-columns:1fr 1fr}.ref-toolbar button{align-self:end}.ref-browser{columns:1}.ref-selection>span{flex-basis:100%;margin:8px 0 0}}
@media(max-width:480px){.ref-toolbar{grid-template-columns:1fr}.ref-browser .ref-card{padding:14px}.ref-card h3{font-size:22px}.ref-card table th,.ref-card table td{font-size:13px}.ref-selection>strong{flex-basis:100%}}
@media print{body>#ref-measure{display:block!important}body.tables-print>#table-print-root{display:block!important;margin:0!important;padding:0!important;overflow:visible!important}body.tables-print>#print-root,body.tables-print>#app,body.tables-print>#print-controls{display:none!important}.tables-print .ref-sheet{break-after:page;margin:0;box-shadow:none}.tables-print .ref-sheet:last-child{break-after:auto}.tables-print .ref-column>.ref-card{break-inside:avoid}.tables-print .ref-measure{display:none!important}}

.ach-intro{display:grid;grid-template-columns:1fr 290px;gap:40px;align-items:center;background:linear-gradient(135deg,var(--sky),transparent 70%);padding:30px 24px;margin:-15px -24px 24px;border-bottom:1px solid var(--line)}.ach-intro p{max-width:650px}.ach-score{display:flex;gap:22px;border-left:1px solid var(--line);padding-left:28px}.ach-score strong{display:block;font:40px Georgia,serif;color:var(--blue)}.ach-score strong small{font:19px Georgia,serif;color:var(--muted)}.ach-score span{font-size:10px;letter-spacing:1px;text-transform:uppercase}.ach-tools{display:grid;grid-template-columns:1.3fr 1.5fr auto auto;gap:12px;align-items:end;margin-bottom:16px}.ach-tools button{font-size:12px}.ach-disclaimer{font-size:12px;max-width:900px;color:var(--muted);margin-bottom:26px}.ach-paths{display:grid;grid-template-columns:1fr 1fr;gap:22px}.ach-path{border:1px solid var(--line);background:var(--sheet);min-width:0}.ach-path-caption{padding:9px 16px;background:var(--wash);border-bottom:1px solid var(--line);font:9px ui-monospace,monospace;letter-spacing:1px;color:var(--blue);display:flex;justify-content:space-between;gap:12px}.ach-path-caption span{font:11px Georgia,serif;letter-spacing:0}.ach-pair{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);height:calc(100% - 34px)}.ach-node{min-width:0;padding:20px 16px;display:flex;flex-direction:column;border-top:3px solid transparent}.ach-node h3{font:27px Georgia,serif;color:var(--blue);margin:9px 0 13px}.ach-node>p{font:13px/1.7 system-ui,sans-serif;margin:0 0 14px}.ach-tier{font:9px ui-monospace,monospace;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}.ach-tier>span{display:block;letter-spacing:0;margin-top:7px;font:10px system-ui,sans-serif;color:var(--blue)}.ach-benefits{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px}.ach-benefits span{font-size:10px;border:1px solid var(--line);padding:3px 6px;background:var(--paper)}.ach-benefits span:last-child{margin-left:auto;back @media(max-width:1100px){.ach-paths{grid-template-columns:1fr}.ach-tools{grid-template-columns:1fr 1fr}.ach-intro{grid-template-columns:1fr}.ach-score{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.ach-intro h1{font-size:48px}.ach-unique{grid-template-columns:1fr 1fr}.ach-discovery{align-items:start;flex-direction:column}.ach-discovery button{max-width:none}}
@media(max-width:520px){.ach-intro{padding:20px 16px;margin:-10px -16px 20px}.ach-intro h1{font-size:39px}.ach-tools{grid-template-columns:1fr}.ach-pair{grid-template-columns:1fr;height:auto}.ach-connector{margin:0 18px;border-left:0;border-top:1px solid var(--line);height:25px;transform:none;font-size:0}.ach-connector:after{content:'↓';font:24px Georgia,serif}.ach-unique{grid-template-columns:1fr}.ach-node{padding:20px}.ach-path-caption span{max-width:70%;text-align:right}.ach-score{justify-content:space-between}.ach-score strong{font-size:36px}}

.heraldry{display:block;width:100%;height:100%;pointer-events:none}.model-mark{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}.model-number{font:9px Georgia,serif;color:var(--muted)}.print-heraldry{float:right;width:13mm;height:16mm;margin:0 0 2mm 2mm;color:black}.print-heading-ornament{display:inline-block;width:6mm;height:6mm;vertical-align:middle;margin-right:3mm}.print-heading-ornament svg{width:100%;height:100%}
@media screen{
 body{background:#1b3447;background-image:radial-gradient(ellipse at top,#37566a,transparent 80%);font-family:var(--book-serif)}
 #app{position:relative;max-width:1320px;width:calc(100% - 48px);margin:24px auto 35px;padding:0 38px;background-color:var(--paper);background-image:var(--medieval-paper);border:1px solid var(--gold);outline:7px solid #17384f;box-shadow:0 12px 65px #0005;min-width:0}
 #app:before,#app:after{content:'';position:absolute;top:0;bottom:0;width:14px;background:#28475b var(--medieval-border) center top/14px 112px repeat-y;border-left:1px solid var(--gold);border-right:1px solid var(--gold);pointer-events:none}
 #app:before{left:6px}#app:after{right:6px;transform:scaleX(-1)}
 .book-corner{position:absolute;width:110px;height:110px;background:var(--medieval-corner) center/contain no-repeat;pointer-events:none;z-index:1}.book-corner.top-left{top:0;left:19px}.book-corner.top-right{top:0;right:19px;transform:rotate(90deg)}.book-corner.bottom-left{bottom:0;left:19px;transform:rotate(-90deg)}.book-corner.bottom-right{bottom:0;right:19px;transform:rotate(180deg)}
 .masthead{background:transparent;color:var(--blue);min-height:145px;padding:30px 20px 24px;gap:25px;flex-wrap:wrap}
 .brand{font:47px/1.15 var(--book-title);letter-spacing:0;gap:13px}.brand-mark{width:39px;height:50px;border:0;border-radius:0;background:var(--empty-shield) center/contain no-repeat}.brand small{font:8px/1.5 Georgia,serif;letter-spacing:2.6px;color:var(--ink);margin-top:5px}
 .library-switch{gap:9px;justify-content:center}.library-switch select{background:#fff7e359;border:1px solid var(--gold);color:var(--ink);font:13px var(--book-serif);max-width:265px}
 .masthead button{color:var(--blue);background:transparent;border-color:var(--gold);font:12px var(--book-serif);padding:8px 12px}.masthead button:hover{background:var(--wash)}
 .subhead{padding:0 8px;border-top:3px double var(--gold);border-bottom:3px double var(--gold);background:transparent;gap:16px;flex-wrap:wrap}nav{gap:0}nav button{padding:16px 13px;border:0;font:13px var(--book-serif);background:none}nav button.active{background:var(--blue);color:var(--paper);font-weight:400;box-shadow:inset 0 0 0 3px #ffffff0c}#save-status{font:9px/1.5 system-ui,sans-serif;padding:6px 0;white-space:normal}
 main{padding:34px 18px 40px;min-width:0}h1,h2,h3{font-family:var(--book-serif)}h1{font-size:clamp(35px,4vw,53px);letter-spacing:-1px}.eyebrow{font-family:Georgia,serif;font-size:10px;letter-spacing:1.7px}.fine,.sub,.knight-foot{font-family:var(--book-serif)}
 button,input,select,textarea{border-radius:0}button{font-family:var(--book-serif)}button.primary{border-color:var(--gold);box-shadow:inset 0 0 0 3px #ffffff0b}button:hover{background-color:var(--wash)}button.primary:hover{background-color:#295d83;color:var(--sheet)}input,select,textarea{background:#fffaf0b8;border-color:var(--line);font-family:var(--book-serif)}input:disabled,select:disabled,textarea:disabled{color:var(--ink);opacity:.7}
 .hero{grid-template-columns:minmax(0,1fr) 245px;gap:35px}.hero>div:first-child{position:relative;padding-left:105px}.hero>div:first-child:before{content:'';position:absolute;left:0;top:12px;width:82px;height:107px;background:var(--empty-shield) center/contain no-repeat}.hero h1{font-size:43px}.hero-actions{gap:9px}.hero-actions button{font-size:13px}
 .quest-card{padding:20px;border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:-5px;background:linear-gradient(90deg,#17374d,#245371,#17374d);color:var(--paper)}.quest-card .eyebrow{color:#e0c78d}.quest-card .number{font-size:48px}.quest-card .number small{font-size:24px;color:#d5c6a3}.quest-card p{font-size:12px;color:var(--paper);line-height:1.6}.renown-track{gap:7px;margin-top:15px}.renown-track i{width:15px;height:15px;border-color:#c8ae70}.renown-track i.filled{background:#c8ae70}
 .section-head{border-top:3px double var(--line)}.section-head h2{font-size:29px}.roster{gap:21px}.knight{padding:21px 23px 17px;background:#fff8e735;border:1px solid var(--gold);outline:1px solid #c9b990;outline-offset:-5px}.knight.named{border-top:1px solid var(--gold)}.knight:hover{background:#fff8e7;box-shadow:0 3px 12px #55482012}.knight h3{color:var(--blue);font-size:29px}.knight-head{gap:15px}.knight .seal{width:42px;min-width:42px;height:54px;border:0;border-radius:0;background:none;color:var(--gold)}.rank{font:10px/1.5 Georgia,serif;color:var(--red);letter-spacing:.6px}.stat-strip{border:1px solid var(--line);padding:7px 0;background:#fffaf02b}.stat-strip small{font:9px Georgia,serif}.stat-strip span{font:25px var(--book-serif)}.kit-line{font-size:13px}.knight-foot{border-top:1px solid var(--line);padding-top:10px;font-size:11px}
 .panel,.item-card{background:#fff9e52e;border-color:var(--line);box-shadow:none}.panel h3,.item-card h3{color:var(--blue)}.workflow{border-top:3px double var(--gold);border-bottom:3px double var(--gold)}.workflow button.active{background:var(--blue);color:var(--paper);border-color:var(--gold)}.step-footer{background:var(--paper);background-image:var(--medieval-paper)}
 .dice-box{background:#f4ecd84f}.segments button.selected{background:var(--blue)}.table-wrap th{font-family:Georgia,serif}.callout{background:#f7edcf;border-color:var(--gold)}.journal-entry{border-left:1px solid var(--gold)}.journal-entry h3{color:var(--blue)}

<script>/* Greathelm 0.4.0: verified campaign primitives. Not a complete builder.
   Pure functions: previews never save, roll implicitly, or mutate a record.
   Ambiguous printed outcomes are returned as unresolved, never silently repaired. */
(function(root){
'use strict';
const SOURCE='Greathelm playtest 0.4.0';
const STATS=Object.freeze(['endurance','agility','bravery','strength','destiny']);
const SKILLS=Object.freeze(['strong','agile','courageous','defensive','duelist','veteran']);
const PROMOTIONS=Object.freeze([
 Object.freeze({xp:3,rank:'Veteran',page:116}),
 Object.freeze({xp:7,rank:'Master',page:116}),
 Object.freeze({xp:12,rank:'Lord',page:116})
]);
function integer(value,label,min=0,max=Number.MAX_SAFE_INTEGER){
 if(!Number.isSafeInteger(value)||value<min||value>max)throw new TypeError(`${label} must be an integer from ${min} to ${max}.`);
 return value;
}
function boolean(value,label){if(typeof value!=='boolean')throw new TypeError(`${label} must be true or false.`);return value;}
function reference(page){return {book:SOURCE,page};}
function eligibleRank(xp){integer(xp,'XP');return [...PROMOTIONS].reverse().find(p=>xp>=p.xp)?.rank||'Novitiate';}
function pendingPromotions(xp,completed=[]){
 integer(xp,'XP');if(!Array.isArray(completed)||new Set(completed).size!==completed.length||completed.some(n=>!PROMOTIONS.some(p=>p.xp===n)||n>xp)||completed.some((n,i)=>n!==PROMOTIONS[i].xp))throw new TypeError('Invalid completed promotion thresholds.');
 return PROMOTIONS.filter(p=>p.xp<=xp&&!completed.includes(p.xp)).map(p=>({...p}));
}
function validateInitialStats(stats){
 const errors=[];
 if(!stats||typeof stats!=='object'||Array.isArray(stats))return ['Choose three stat points.'];
 if(Object.keys(stats).some(k=>!STATS.includes(k)))errors.push('Unknown stat.');
 for(const key of STATS)if(!Number.isInteger(stats[key])||stats[key]<0||stats[key]>2)errors.push(`${key}: choose 0, 1 or 2 points.`);
 if(STATS.reduce((n,k)=>n+(Number.isInteger(stats[k])?stats[k]:0),0)!==3)errors.push('A newly named knight receives exactly three points.');
 return errors;
}
function xpBreakdown(input){
 const namedAtStart=boolean(input.namedAtStart,'Named at start'),lastingInjury=boolean(input.lastingInjury,'Lasting injury');
 const scenes=integer(input.scenes,'Scenes'),gruesomeKills=integer(input.gruesomeKills,'Gruesome deaths inflicted');
 const scenario=integer(input.scenarioBonus,'Scenario XP');boolean(input.battlefieldLesson,'Battlefield lesson');
 // Call for knights continuing on the active register. Death/capture is a separate transition.
 const eligible=namedAtStart&&!lastingInjury;
 const parts={scenes:eligible?scenes:0,scenario:eligible?scenario:0,gruesome:eligible&&gruesomeKills>0?1:0,lesson:eligible&&input.battlefieldLesson?1:0};
 return {eligible,reason:!namedAtStart?'Newly named knights earn no XP from this battle.':lastingInjury?'Lasting injury prevents all XP from this battle.':null,
  parts,total:Object.values(parts).reduce((n,v)=>n+v,0),source:reference(116),lessonSource:reference(114)};
}
function projectPromotion(knight,choice){
 if(!knight||knight.named!==true)throw new Error('Only named knights can receive promotions.');
 const pending=pendingPromotions(knight.xp,knight.promotions||[]);
 if(!pending.length||choice.threshold!==pending[0].xp)throw new Error('Resolve the next unclaimed promotion in order.');
 if(!STATS.includes(choice.stat))throw new Error('Choose a stat.');
 for(const key of STATS)integer(knight.stats?.[key],key,0,3);
 if(knight.stats[choice.stat]>=3)throw new Error('No stat may exceed three points.');
 if(!Array.isArray(knight.skills)||knight.skills.some(s=>!SKILLS.includes(s))||new Set(knight.skills).size!==knight.skills.length)throw new Error('Invalid skill record.');
 integer(knight.abilityDice,'Ability dice');
 const next=structuredClone(knight);
 next.stats[choice.stat]++;
 if(choice.reward?.kind==='skill'){
  if(!SKILLS.includes(choice.reward.skill))throw new Error('Choose a core knight skill.');
  // The book does not define stacking an identical reroll skill. Do not fabricate it.
  if(next.skills.includes(choice.reward.skill))throw new Error('Duplicate skill needs an explicit ruling; choose a different skill or ability die.');
  next.skills.push(choice.reward.skill);
 }else if(choice.reward?.kind==='ability-die')next.abilityDice++;
 else throw new Error('Choose one skill OR one ability die.');
 next.promotions=[...(next.promotions||[]),choice.threshold];
 return {before:structuredClone(knight),after:next,source:reference(116)};
}
function dice(sides,count,random=Math.random){
 integer(sides,'Die faces',2,100);integer(count,'Dice count',1,20);
 return Array.from({length:count},()=>{const value=random();if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>=1)throw new Error('Random source must return a number in [0,1).');return 1+Math.floor(value*sides);});
}
const SURVIVAL=Object.freeze(['battle-injury','captured','lost-equipment','survived','battlefield-lesson']);
function survivalRoll(faces,destinySpent=0){
 if(!Array.isArray(faces)||faces.length!==2)throw new Error('Record two separate d6 results.');
 faces.forEach(n=>integer(n,'d6 result',1,6));integer(destinySpent,'Destiny spent',0,3);
 const natural=faces[0]+faces[1],total=natural+destinySpent;
 if(total>12)return {mode:'dice',faces:[...faces],natural,destinySpent,total,outcome:null,unresolved:'The printed table ends at 12. Confirm how Destiny totals above 12 are resolved.',source:reference(114)};
 const outcome=total===2?'battle-injury':total===3?'captured':total<=6?'lost-equipment':total<=11?'survived':'battlefield-lesson';
 return {mode:'dice',faces:[...faces],natural,destinySpent,total,outcome,unresolved:null,source:reference(114)};
}
function survivalChoice(outcome){
 if(!SURVIVAL.includes(outcome))throw new Error('Unknown survival outcome.');
 return {mode:'chosen',faces:null,natural:null,destinySpent:0,total:null,outcome,unresolved:null,source:reference(114)};
}
function injuryResult(value){
 integer(value,'Injury table result',1);
 // This only looks up the printed rows (1, 2–3, 4+). It does not choose a die size.
 return {value,outcome:value===1?'head-wound':value<=3?'broken-body':'lasting-injury',source:reference(114)};
}
function spoilsRollCount(result){
 if(!['major-victory','major-defeat','minor-victory','minor-defeat'].includes(result))throw new Error('Unknown battle result; ties require a ruling.');
 return result==='major-victory'?2:1;
}
function spoilsOptions(value){
 integer(value,'Spoils d6',1,6);
 const option=(count,families,distinct=false)=>({count,families,distinct});
 const alternatives=value===1?[option(1,['consumable'])]:value<=4?[option(1,['worn','consumable'])]:value===5?[option(1,['use','worn','upgrade'])]:[option(2,['consumable','worn','use','upgrade'],true),option(1,['legendary'])];
 return {value,alternatives,source:reference(113)};
}
function consumableBuffResult(value){
 integer(value,'Printed consumable-buff d6',1,6);
 const item=['Jasmin Oils','Rose Oils','Lavender Oils'][value-1]||null;
 return {value,item,unresolved:item?null:'The heading says d6, but only results 1–3 are printed. Do not reroll or remap without a ruling.',source:reference(44)};
}
function validateScene(selections,removedNamedIds=[]){
 const issues=[],ids=new Set();let soldiers=0,models=0;
 if(!Array.isArray(selections))throw new TypeError('Scene selections must be an array.');
 if(selections.length>6)issues.push('At most six selections may be deployed (p.112).');
 const types=['knight','sergeant','swordsman','spearman','billman','bowman','crossbowman','militia-levy','outlaw'];
 for(const selection of selections){
  const members=selection.members;
  if(!Array.isArray(members)||!members.length){issues.push('Every selection needs a model.');continue;}
  models+=members.length;
  const levy=members.every(m=>m.type==='militia-levy');
  if(levy?members.length!==2:members.length!==1)issues.push('A levy selection is two models; other selections are one (p.124).');
  if(members.some(m=>m.type!=='knight'))soldiers++;
  for(const model of members){
   if(!types.includes(model.type))issues.push('Unknown model type.');
   if(typeof model.id!=='string'||!model.id||ids.has(model.id))issues.push('Every physical model needs a unique ID.');

ilters the screen; the print selection stays explicit. No cover sheet, no one-table-per-page waste, no campaign names or notes. Prints During play first, then After battle, starting each group on a new page. Default order follows gameplay priority: advanced actions, round sequence and combat first; rewards and progression start the post-game group. Optional and solo references follow the core material in each group. Tables are never moved ahead just to fill space. “Keep book order” explicitly switches to the book sequence within each group. Full selected rows are retained. Oversized tables continue with repeated headings.</p><details class="ref-scope"><summary>Coverage, source notes & optional rules</summary><p>This atlas summarizes the book’s reference lists, action bars, equipment tables, Knightly Quest progression and solo encounter/event tables. It does not reproduce maps, narrative entries, complete scenario instructions or every dice check embedded in scenario prose. Introductory actions are covered by their own bar; the advanced bar is the normal expanded reference.</p><p>Optional and solo references do not enable those modes in the campaign builder. Unspecified results, die sizes and inconsistent names stay marked. The supplied 0.4.0 book takes precedence over older game aids. Layout is optimized for A4 at 100%; browser headers/footers should be off.</p></details><div id="ref-results">${list()}</div></section>`;}

function state(order,modelId,deed,projection){

 else if(deed.tier===2&&!k.named)reason='Beta convention: must be named at battle start.';

}

function readOrderSetup(form){const f=new FormData(form);return {...orderSetup,name:String(f.get('name')||''),player:String(f.get('player')||''),renown:String(f.get('renown')||''),accepted:f.get('accepted')==='on',labels:Array.from({length:6},(_,i)=>String(f.get(`label-${i}`)||'')),kits:Array.from({length:6},(_,i)=>({weapon:String(f.get(`kit-${i}-weapon`)||''),shield:String(f.get(`kit-${i}-shield`)||''),armour:String(f.get(`kit-${i}-armour`)||'')}))};}

function generateOrder(){const form=$('#order-form')||(modal?.type==='new'?$('#modal-form'):null);if(!form)return;orderSetup=readOrderSetup(form);if((orderSetup.name.trim()||JSON.stringify(orderSetup.kits)!==JSON.stringify(G.initial().kits))&&!confirm('Replace the order name and all six starting kits? Knight names, player and convention settings will be kept. Saved orders will not change.'))return;Object.assign(orderSetup,G.generate(),{generated:true});if(modal?.type==='new')$('#dialog-body').innerHTML=orderCreationForm(false);else render();}
function submitNewOrder(form){orderSetup=readOrderSetup(form);const s=orderSetup,order=C.createOrder(s.name,s.player,{accepted:s.accepted,renown:s.renown,conventionsVersion:1});order.models.forEach((k,i)=>{k.label=s.labels[i].trim()||k.label;k.kit={...s.kits[i]};});C.validateOrder(order);if(s.generated)C.event(order,'Initial order prepared with the offline Order Generator; starting name and kits reviewed by the player. No campaign rewards granted.');change(l=>{if(l.orders.length>=30)throw new Error('Export your library before creating more than 30 orders.');l.orders.push(order);l.active=order.id;},false);orderSetup=G.initial();closeDialog();navigate('order');}
function renderOrder(){const o=active(),named=o.models.filter(k=>k.named&&k.status==='active'),ren=C.renown(o),games=o.battles.filter(b=>!b.reverted).length;return `<section class="hero register-header"><div><div class="eyebrow">${h(o.player||'Knight register')} · ${games?'Campaign in progress':'New campaign'}</div><h1>${h(o.name)}</h1><p>Select a model to view or edit its record. Use Print for record sheets.</p><div class="hero-actions">${btn(o.draft?'resume-battle':'start-battle',o.draft?'Continue aftermath →':'Record a battle →',o.draft?'primary':'')}${btn('edit-order','Order details')}${btn('catchup','Join mid-campaign')}</div></div><aside class="quest-card"><div><div class="eyebrow">Renown</div><div class="number">${ren}<small> / ${o.renownTarget}</small></div></div><div><div class="renown-track">${Array.from({length:Math.min(o.renownTarget,12)},(_,i)=>`<i class="${i<ren?'filled':''}"></i>`).join('')}</div><p>${ren>=o.renownTarget?'Quest target reached after the last recorded battle.':`${games} battle${games!==1?'s':''} recorded · ${named.length}/12 named knights`}<br>Convention: ${o.settings.renown==='per-knight'?'one renown per active knight with Tier 2':'one per Tier 2 achievement on active knights'}.</p></div></aside></section>${o.draft?'<div class="callout">An aftermath is in progress. The register below is still the committed record; proposed changes live in the draft until you confirm.</div>':''}<div class="section-head"><div><h2>Knights</h2><small>Click a model to inspect its kit, record tabletop marks or edit its identity.</small></div>${btn('add-model','+ Add model','',o.draft?'disabled':'')}</div><div class="roster">${o.models.filter(k=>k.status==='active').map((k,i)=>`<button class="knight ${k.named?'named':''}" data-model="${k.id}"><div class="knight-head"><span class="model-mark"><span class="seal">${blankShield('heraldry')}</span><small class="model-number">${String(i+1).padStart(2,'0')}</small></span><div><h3>${h(C.label(k))}</h3><span class="sub">${h(k.named?k.label:'Unnamed knight')}</span></div><span class="rank">${k.named?currentRank(k):'Knight'}</span></div>${stats(k)}<div class="kit-line">${h(kitText(k))}</div><div class="knight-foot"><span>${k.named?`${k.xp} XP · ${k.abilityDice} ability dice`:'Name earned at the feast'}</span><span>Damage limit ${3+k.stats.endurance} · ${k.achievements.length} deeds</span></div></button>`).join('')||'<div class="empty">No active models. Add a new model to continue.</div>'}</div>${o.models.some(k=>k.status!=='active')?`<div class="section-head"><div><h2>Inactive records</h2><small>Capture and death preserve the complete character record.</small></div></div><div class="roster">${o.models.filter(k=>k.status!=='active').map(k=>`<button class="knight" data-model="${k.id}"><h3>${h(C.label(k))}</h3><p class="fine">${title(k.status)} · ${k.xp} XP</p></button>`).join('')}</div>`:''}`;}
function renderAftermath(){const o=active();if(!o.draft)return `<h1>Aftermath</h1><p class="wide-copy muted">Record the scenes and deeds, resolve the spoils and missing knights, then welcome a new name at the feast. Nothing touches the register until you review and confirm.</p><div class="hero-actions">${btn('start-battle','Record a battle','primary')}</div><div class="workflow">${steps.map((s,i)=>`<div style="padding:18px">${s}</div>`).join('')}</div>`;
 const d=o.draft,p=C.projectBattle(o),step=d.step,gear=step===4&&W.managePane(d)==='equipment';
 return `<div class="eyebrow">After the battle · Step ${step+1} of 6 · Draft only</div><div class="step-title"><div><h2>${h(d.scenario||'New battle')}</h2><p>Answer the current question, then continue. Dice are rolled at your table; changes are applied together at the end.</p></div>${btn('discard-battle','Discard draft','danger')}</div><div class="workflow" aria-label="Aftermath steps">${steps.map((name,i)=>`<button data-step="${i}" class="${i===step?'active':''}" aria-current="${i===step?'step':'false'}">${name}</button>`).join('')}</div><div id="aftermath-step" data-current-step="${step}">${step===4?W.manageMenu(d)+(gear?W.equipment(o,d,p):promotionsStep(o,d,p)):[battleStep,W.spoils,W.survival,W.feast,promotionsStep,reviewStep][step](o,d,p)}${step<5&&p.issues.some(e=>e.step===step)?`<div class="callout"><strong>Still to resolve in this step</strong><ul>${p.issues.filter(e=>e.step===step).map(e=>`<li>${h(e.text)}</li>`).join('')}</ul></div>`:''}</div><div class="step-footer">${gear?'<button data-flow-scope="manage" data-flow-key="xp">← XP & promotions</button>':step?`<button data-step="${step-1}">← Back</button>`:''}<span>Draft only · the original register is unchanged.</span>${step===4&&!gear?`<button class="primary push" data-flow-scope="manage" data-flow-key="equipment" ${p.issues.some(e=>e.step<4||e.step===4&&!e.text.startsWith('Equipment plan '))?'disabled':''}>Choose item destinations →</button>`:step<5?`<button data-step="${step+1}" class="primary push" ${p.issues.some(e=>e.step<=step)?'disabled':''}>${steps[step+1]} →</button>`:btn('commit-battle','Confirm aftermath','primary push',p.issues.length?'disabled':'')}</div>`;
}
function battleStep(o,d){return `<h2>What happened in the battle?</h2><p>Record participation and casualties first. Spoils belong to the order; each knight’s XP depends on their own battle facts.</p><div class="panel"><div class="form-grid">${field('scenario','Scenario')}${field('opponent','Opponent / opposing order')}${selectField('result','Battle result',v=>option('','Select the battle result…',v)+['minor-victory','minor-defeat','major-victory','major-defeat'].map(x=>option(x,title(x),v)).join(''))}${selectField('role','Your role',v=>option('','Select your role…',v)+['attacker','defender'].map(x=>option(x,title(x),v)).join(''))}</div><p class="fine" style="margin-top:12px">No back-to-back scenario repeats. Major victory grants two spoils rolls; other listed results grant one. Ties need a group ruling outside this release. ${source(112)}</p></div>${d.scenes.map((s,i)=>`<section class="panel"><div class="section-head" style="margin-top:0;padding-top:0;border:0"><h3>Scene ${i+1}</h3>${i?btn('remove-scene','Remove scene','text-button',`data-index="${i}"`):''}</div>${field(`scenes.${i}.name`,'Scene title')}<p class="fine" id="scene-help-${i}" style="margin-top:12px">Tick <strong>Here</strong> beside each model that took part in this scene to unlock its outcome. Unticked models did not participate; their outcome selector stays disabled.</p><div class="table-wrap" data-scroll="scene-${i}"><table><thead><tr><th>Here</th><th>Model</th><th>Outcome in this scene</th></tr></thead><tbody>${o.models.filter(k=>k.status==='active').map(k=>`<tr class="scene-row"><td><input type="checkbox" aria-label="Deploy ${h(C.label(k))} in scene ${i+1}" data-deploy="${i}" data-id="${k.id}" ${s.deployed.includes(k.id)?'checked':''}></td><td><strong class="person">${h(C.label(k))}</strong><small>${k.named?'Named knight':'Unnamed knight'}</small></td><td><select aria-label="${h(C.label(k))} scene outcome" aria-describedby="scene-help-${i}" data-casualty="${i}" data-id="${k.id}" ${!s.deployed.includes(k.id)?'disabled':''}>${!s.deployed.includes(k.id)?'<option value="">Not deployed — tick Here first</option>':[['stayed','Stayed / withdrew safely'],['removed','Removed, not gruesomely slain'],['slain','Gruesomely slain']].map(([v,t])=>option(v,t,s.slain.includes(k.id)?'slain':s.removed.includes(k.id)?'removed':'stayed')).join('')}</select></td></tr>`).join('')}</tbody></table></div><p class="fine">${s.deployed.length}/6 selected. A named casualty cannot return in a later scene.</p></section>`).join('')}<div class="actions">${btn('add-scene','+ Add another scene')}</div>${W.battleFacts(o,d)}`;}
function promotionsStep(o,d,p){return `<div class="step-title"><div><h2>How much XP did each knight earn?</h2><p>Calculated from your battle record — not rolled, and not a bonus for winning. Knights first named at this feast gain 0 XP from this battle.</p></div>${source(116)}</div>${W.disclosure('xp','Check the XP rules')}${W.disclosure('promotions','Check promotion milestones')}${p.promotionCards.length?W.disclosure('skills','Compare skills and ability dice'):''}<section class="panel"><div class="table-wrap"><table><thead><tr><th>Knight</th><th>Scenes</th><th>Scenario</th><th>Gruesome</th><th>Lesson</th><th>XP</th></tr></thead><tbody>${p.xp.map(x=>`<tr><td><strong>${h(x.name)}</strong>${x.reason?`<small>${h(x.reason)}</small>`:''}</td><td>${x.parts.scenes}</td><td>${x.parts.scenario}</td><td>${x.parts.gruesome}</td><td>${x.parts.lesson}</td><td>${x.before} → <strong>${x.after}</strong></td></tr>`).join('')||'<tr><td colspan="6">No active named knights gain XP yet.</td></tr>'}</tbody></table></div></section>${p.promotionCards.map(card=>{const c=card.choice,k=card.before,reward=c?.reward?.kind==='ability-die'?'ability-die':c?.reward?.skill||'';return `<section class="panel"><div class="section-head" style="margin-top:0;padding-top:0;border:0"><div><h3>${h(C.label(k))} → ${card.rank}</h3><small>${card.threshold} XP milestone · one reward, once only</small></div></div>${stats(k)}${c?.needsReview?`<label class="check callout"><input type="checkbox" data-promotion-review="${k.id}" data-threshold="${card.threshold}">Facts changed after this choice. I have reviewed and want to keep it.</label>`:''}<div class="form-grid"><label>One stat point<select data-promotion="${k.id}" data-threshold="${card.threshold}" data-part="stat">${opts(R.STATS.map(s=>({id:s,name:title(s)+` (${k.stats[s]} → ${Math.min(3,k.stats[s]+1)})`,disabled:k.stats[s]>=3})),c?.stat||'')}</select></label><label>Skill or ability die<select data-promotion="${k.id}" data-threshold="${card.threshold}" data-part="reward">${opts([{id:'ability-die',name:'+1 ability die'},...R.SKILLS.map(s=>({id:s,name:title(s)+' — '+D.skillText[s],disabled:k.skills.includes(s)}))],reward)}</select></label></div><p class="fine" style="margin-top:12px">Choose the stat and skill or ability die yourself. Promotions do not use a random table. ${c?.origin==='suggested'?'Current choice was suggested by the app.':''}</p></section>`;}).join('')||'<div class="empty">No promotion is due. Continue to item destinations.</div>'}`;}
function reviewStep(o,d,p){return `<div class="step-title"><div><h2>Ready to apply this aftermath?</h2><p>Check the first-name decision, XP and item destinations below. Confirm once to update the register.</p></div></div>${p.issues.length?`<div class="issue-list"><strong>${p.issues.length} thing(s) to resolve</strong>${p.issues.map(e=>`<button data-step="${e.step}">${steps[e.step]} → ${h(e.text)}</button>`).join('')}</div>`:'<div class="callout success">All required choices are resolved. Ready to record.</div>'}<section class="panel"><h3>First-name discovery</h3><p>${d.feast.choice===''?'Not decided yet.':d.feast.modelId?`${h(o.models.find(k=>k.id===d.feast.modelId).label)} → <strong>${h(d.feast.name||'Name still required')}</strong>. Three starting stat points; <strong>0 XP from this battle</strong>.`:'No new name this battle. Already named knights keep their status.'}</p></section><div class="preview-strip"><div>Renown<strong>${p.renownBefore} → ${p.renownAfter}</strong></div><div>New items<strong>${p.loot.length}</strong></div><div>XP awarded<strong>${p.xp.reduce((n,x)=>n+x.total,0)}</strong></div><div>Named register<strong>${o.models.filter(k=>k.named&&k.status==='active').length} → ${p.after.models.filter(k=>k.named&&k.status==='active').length}</strong></div></div><section class="panel"><h3>${h(d.scenario||'Unnamed battle')}</h3><p class="fine">${h(title(d.result))} · ${d.scenes.length} scene(s) · ${h(d.opponent||'Opponent not recorded')}</p><ul class="change-list">${p.changes.map(t=>`<li>${h(t)}</li>`).join('')||'<li>No permanent knight changes.</li>'}</ul><p class="fine">Equipment plans above apply with the rest of the aftermath. Unassigned items remain in the stash. Active tabletop marks reset only after survival has used the previous Destiny pool. Dead/captured equipment stays attached and is not silently reclaimed.</p></section>${p.renownAfter>=o.renownTarget?'<div class="callout">This aftermath reaches the quest’s renown target under your recorded convention.</div>':''}`;}
function renderArmoury(){const o=active(),available=o.equipment.filter(e=>['stored','carried'].includes(e.status));return `<h1>Armoury</h1><p class="muted">Every item is an individual object. Giving, returning or consuming it never makes a second copy.</p><div class="actions">${btn('add-item','Record existing item','',o.draft?'disabled':'')}</div>${o.draft?'<div class="callout">Inventory is locked while an aftermath is open. Its new loot appears after confirmation.</div>':''}<div class="section-head"><h2>${available.length} available item${available.length===1?'':'s'}</h2></div><div class="item-grid">${available.map(e=>{const def=D.byId[e.def],owner=o.models.find(k=>k.id===e.owner);return `<article class="item-card"><div class="eyebrow">${h(title(def.group))} · ${source(def.page)}</div><h3>${h(def.name)}</h3><p>${h(def.text)}</p><p class="fine">${owner?'With '+h(C.label(owner))+' · '+owner.status:'In the stash'}</p><label>Move to<select data-equip="${e.id}" ${o.draft?'disabled':''}>${option('','Stash',e.owner||'')}${owner&&owner.status!=='active'?option(owner.id,'Unavailable · '+C.label(owner),e.owner,true):''}${o.models.filter(k=>k.named&&k.status==='active').map(k=>option(k.id,C.label(k),e.owner)).join('')}</select></label>${def.group==='consumable'?btn('consume','Mark consumed','text-button',`data-id="${e.id}" ${o.draft?'disabled':''}`):''}</article>`;}).join('')||'<div class="empty">Nothing stored yet. Resolve a battle’s spoils, or record items from an existing campaign.</div>'}</div><details style="margin-top:24px"><summary>Used and lost items (${o.equipment.length-available.length})</summary>${o.equipment.filter(e=>!['stored','carried'].includes(e.status)).map(e=>`<p class="fine">${h(D.byId[e.def].name)} · ${h(e.status)}</p>`).join('')}</details><div class="callout">Worn items, upgrades and legendary armor cannot be freely removed. A legendary replacement returns the old item to the stash. Sturdy Belt’s unresolved extra capacity is not silently granted.</div>`;}
function renderChronicle(){const o=active(),last=o.battles.filter(b=>!b.reverted).at(-1);return `<h1>History</h1><p class="muted">Automatic log of battles, decisions and changes to your records. No narrative entry is required.</p>${last?btn('reopen-battle','Reopen the latest battle','',o.draft||o.revision!==last.afterRevision?'disabled':''):''}<p class="fine" style="margin-top:10px">Reopening reverses only the latest battle, before any later changes. Its original record remains marked as reversed, and recorded dice are retained.</p>${[...o.battles].reverse().map(b=>`<article class="journal-entry ${b.reverted?'reverted':''}"><time>${h(new Date(b.at).toLocaleString())} ${b.reverted?'· REVERSED':''}</time><h3>${h(b.scenario)}</h3><p class="fine">${h(b.opponent||'Opponent not recorded')} · ${h(title(b.draft.result))}</p><ul class="change-list">${b.changes.map(t=>`<li>${h(t)}</li>`).join('')}</ul><details data-detail="battle-${b.id}"><summary>Recorded dice, choices and rulings</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px">${h(JSON.stringify({spoils:b.draft.spoils,missing:b.draft.missing,feast:b.draft.feast,promotions:b.draft.promotions,equipmentMoves:b.draft.equipmentMoves||[],facts:b.draft.facts,notes:b.draft.notes},null,2))}</pre></details></article>`).join('')||'<div class="empty">No battles recorded yet.</div>'}<section class="panel"><h3>Record changes</h3>${[...o.chronicle].reverse().map(e=>`<p class="fine"><strong>${h(new Date(e.at).toLocaleString())}</strong> — ${h(e.text)}</p>`).join('')||'<p class="fine">No changes recorded.</p>'}</section>`;}
function rulingsText(){return `<ul><li><strong>Starting kit:</strong> ordinary WYSIWYG arms and armor are present; “no equipment” is interpreted as no extra campaign items.</li><li><strong>Renown:</strong> choose one contribution per active knight with Tier 2, or one per Tier 2 achievement. Dead/captured knights do not contribute. Captured knights keep achievement claims; death releases them.</li><li><strong>Missing knights:</strong> use only unspent Destiny before the reset. Totals above 12 require a recorded ruling, not an automatic cap.</li><li><strong>Injuries:</strong> d6 is an agreed convention. Random loss selects uniformly among positive E/A/S scores, or known skills and individual ability dice. Empty pools require a written ruling.</li><li><strong>Lost equipment:</strong> ordinary base kit and legendary armor are excluded from the provisional loss pool. Worn/use/consumable items and upgrades are included.</li><li><strong>Capture:</strong> no battle XP is applied while the knight is off the active register. A correction with a reason can reconcile a later ruling.</li><li><strong>Achievements:</strong> same-battle Tier 1 then Tier 2 is allowed for previously named knights. Stat overflow requires agreement to forgo the excess point; no silent redirection.</li><li><strong>Sturdy Belt:</strong> extra item capacity is not implemented pending clarification. Duplicate skills, optional soldiers/levies, dual wielding, cavalry and solo hex campaigns are not enabled in this release.</li></ul>`;}
function renderAchievements(){const o=active();if(!o?.models.some(k=>k.id===achievementModelId))achievementModelId='';return A.view(o,achievementModelId,achievementQuery);}
function renderRules(){return `<h1>Rules & table rulings</h1><p class="wide-copy muted">This beta follows the supplied Greathelm playtest 0.4.0. Some printed passages need clarification from Malev. These are explicit working conventions, not claims of official errata.</p><div class="rule-grid"><section class="panel"><h3>The campaign loop</h3><ol class="change-list"><li>Record scenes and achievements.</li><li>Resolve spoils and missing named knights.</li><li>At the feast, name at most one eligible knight.</li><li>Award XP, then resolve each promotion.</li><li>Distribute equipment in Manage knights, then review and confirm everything together.</li></ol><p class="fine">3 / 7 / 12 XP: Veteran / Master / Lord. Each gives one stat point and one skill or ability die. Newly named and lasting-injury knights earn no XP from that battle.</p></section><section class="panel"><h3>Local, yours, portable</h3><p class="fine">Saves are local to this browser and origin. File, localhost and a future website do not share saves. Export JSON before changing devices or clearing browser data. This app makes no network requests.</p><p class="fine">Import creates a new order; it does not overwrite the current one. Another tab or storage failure blocks writes rather than silently claiming success. Printed forms never alter your order.</p><p class="fine">Printing includes current equipment/skill summaries and campaign tables by default. It does not replace the full combat or scenario rulebook.</p></section></div><section class="panel"><h3>Provisional conventions used by this release</h3>${rulingsText()}<p class="fine">Each order requires explicit acceptance at creation. Unresolved buff results 4–6, Destiny overflow and empty injury pools require a further written decision when encountered.</p></section><section class="panel"><h3>Core knight skills</h3>${Object.entries(D.skillText).map(([s,t])=>`<p><strong>${title(s)}.</strong> ${h(t)} ${source(107)}</p>`).join('')}</section><section class="panel"><h3>Follow the paths</h3><p>Achievements now have a dedicated connected progression view, with prerequisites, benefits and the order’s recorded claims.</p><button data-view="achievements">Explore achievements →</button> <button data-view="tables">Browse all reference tables →</button></section>`;}
function openDialog(type,html,context={}){modal={type,...context};$('#dialog-body').innerHTML=html;$('#dialog').showModal();setTimeout(()=>$('#dialog-body').querySelector('input,select,button')?.focus(),0);}
function closeDialog(){if($('#dialog').open)$('#dialog').close();modal=null;}
function formHead(titleText,body,button='Save'){return `<form id="modal-form"><h2 id="dialog-title">${titleText}</h2>${body}<div class="dialog-footer">${btn('close-dialog','Cancel')}<button type="submit" class="primary">${button}</button></div></form>`;}
function openNew(){if(!active()){navigate('order');return;}orderSetup=G.initial();openDialog('new',orderCreationForm(false));}
function openOrder(){const o=active();guardDraft(o);openDialog('order',formHead('Order details',`<div class="form-grid"><label>Order name<input name="name" value="${h(o.name)}" required maxlength="200"></label><label>Player<input name="player" value="${h(o.player)}" maxlength="200"></label><label>Renown target<input name="target" type="number" min="1" max="100" required value="${o.renownTarget}"></label></div><p class="fine" style="margin-top:15px">The renown convention is preserved for this campaign. Export a backup before changing campaign state.</p>`));}
function equipmentDescriptions(ids){return ids.filter(id=>D.byId[id]).map(id=>{const def=D.byId[id];return `<article data-equipment-description="${h(id)}"><b>${h(def.name)} ${source(def.page)}</b>${h(def.text)}</article>`;}).join('');}
function updateKitPreview(){
 if(modal?.type!=='model')return;const o=active(),k=o?.models.find(k=>k.id===modal.id),form=$('#modal-form');if(!k||!form)return;
 const weapon=form.elements.weapon,shield=form.elements.shield,armour=form.elements.armour,twoHanded=D.byId[weapon.value]?.hands===2;
 if(twoHanded)shield.value='';shield.disabled=k.named||Boolean(o.draft)||twoHanded;
 $('#kit-preview').innerHTML=equipmentDescriptions([weapon.value,shield.value,armour.value]);
 const changed=weapon.value!==k.kit.weapon||shield.value!==k.kit.shield||armour.value!==k.kit.armour;
 $('#kit-preview-note').textContent=(changed?'Preview only — Save record applies these changes.':'Descriptions match the selected kit.')+(twoHanded?' A two-handed weapon leaves no shield slot.':'');
}
function profile(id){const o=active(),k=o.models.find(k=>k.id===id);if(!k)return;
 openDialog('model',formHead(h(C.label(k)),`<p class="fine">${k.named?`${currentRank(k)} · ${k.xp} XP · named knight`:'Unnamed knight · model identity is not an earned name'} · ${h(k.status)}</p>${stats(k)}<div class="form-grid"><label>Model label<input name="label" required maxlength="200" value="${h(k.label)}"></label>${k.named?`<label>Earned name<input name="name" required maxlength="200" value="${h(k.name)}"></label>`:''}<label>Weapon<select name="weapon" ${k.named?'disabled':''}>${kitOptions('weapon',k.kit.weapon)}</select></label><label>Shield<select name="shield" ${k.named?'disabled':''}>${option('','No shield',k.kit.shield)}${kitOptions('shield',k.kit.shield)}</select></label><label>Armor<select name="armour" ${k.named?'disabled':''}>${kitOptions('armour',k.kit.armour)}</select></label></div>${k.named?'<p class="fine" style="margin-top:12px">The named knight’s base model and arms are locked. A legendary armor item is tracked separately in Armoury.</p>':''}<p id="kit-preview-note" class="fine" role="status"></p><div id="kit-preview" class="detail-kit" aria-live="polite"></div>${o.equipment.some(e=>e.owner===k.id&&e.status==='carried')?`<h3>Carried equipment</h3><div class="detail-kit">${equipmentDescriptions(o.equipment.filter(e=>e.owner===k.id&&e.status==='carried').map(e=>e.def))}</div>`:''}${k.skills.length?`<h3>Skills</h3>${k.skills.map(s=>`<p class="fine"><strong>${title(s)}.</strong> ${h(D.skillText[s])}</p>`).join('')}`:''}<h3>At the table</h3><div class="tracking"><label>Damage<input name="damage" type="number" min="0" max="100" value="${k.play.damage}" required></label><label>Momentum<input name="momentum" type="number" min="0" max="100" value="${k.play.momentum}" required></label>${['bravery','strength','destiny'].map(s=>`<label>${title(s)} spent<input name="spent-${s}" type="number" min="0" max="${k.stats[s]}" value="${Math.min(k.play.spent[s],k.stats[s])}" required></label>`).join('')}</div><p class="fine" style="margin-top:10px">Damage limit ${3+k.stats.endurance}. Mark casualties explicitly in the battle record; these counters do not decide death or simulate combat.</p><label>Notes<textarea name="notes">${h(k.notes)}</textarea></label>${k.achievements.length?`<p class="fine">Deeds: ${k.achievements.map(a=>h(D.deedById[a].name)).join(', ')}</p>`:''}${k.injuries.length?`<p class="fine">Recorded injuries: ${k.injuries.map(x=>h(title(x.kind))).join(', ')}</p>`:''}<div class="actions">${k.named?btn('correct-model','Record a state correction','text-button',`data-id="${k.id}"`):''}${k.status==='captured'?btn('rescue','Record a rescue','text-button',`data-id="${k.id}"`):''}${k.status==='active'?btn('retire','Retire from active register','text-button danger',`data-id="${k.id}"`):''}</div>${o.draft?'<div class="callout">An aftermath is open. This profile is read-only until it is finished or discarded.</div>':''}`,'Save record'),{id});
 updateKitPreview();
 if(o.draft)$('#modal-form').querySelectorAll('input,select,textarea,button[type=submit],button[data-action=correct-model],button[data-action=rescue],button[data-action=retire]').forEach(el=>el.disabled=true);
}
function catchup(id){const o=active();guardDraft(o);const k=id?o.models.find(k=>k.id===id):null;closeDialog();
 openDialog('catchup',formHead(k?'Record a state correction':'Join an existing campaign',`<div class="callout">This records what already happened; it does not grant new rewards. XP milestones are marked already resolved. Enter the actual stats, skills and ability dice from your paper record. Historical entitlements are not inferred or certified.</div>${!k?`<label>Which unnamed model?<select name="model" required>${opts(o.models.filter(k=>!k.named&&k.status==='active').map(k=>({id:k.id,name:k.label})), '')}</select></label>`:''}<div class="form-grid"><label>Knight’s earned name<input name="name" value="${h(k?.name||'')}" required maxlength="200"></label><label>Current accumulated XP<input name="xp" type="number" min="0" max="100000" value="${k?.xp||0}" required></label></div><div class="stat-inputs" style="margin:18px 0">${R.STATS.map(s=>`<label>${title(s)}<input name="stat-${s}" type="number" min="0" max="3" value="${k?.stats[s]||0}" required></label>`).join('')}</div><label>Ability dice<input name="ability" type="number" min="0" max="50" value="${k?.abilityDice||0}" required></label><div class="grid-three" style="margin-top:12px">${R.SKILLS.map(s=>`<label class="check"><input type="checkbox" name="skill" value="${s}" ${k?.skills.includes(s)?'checked':''}>${title(s)}</label>`).join('')}</div><details style="margin:16px 0"><summary>Recorded achievements</summary>${D.achievements.map(a=>`<label class="check"><input type="checkbox" name="achievement" value="${a.id}" ${k?.achievements.includes(a.id)?'checked':''}>${h(a.name)} · ${a.tier===3?'Unique':'Tier '+a.tier}</label>`).join('')}</details><label>Reason / source of this recorded state<textarea name="reason" required placeholder="Paper register after our third battle; or explain the correction/ruling."></textarea></label><label class="check"><input type="checkbox" name="confirm" required>I understand this records a manual state, not an automatic reward.</label>`,'Record state'),{id:k?.id});}
function addItemDialog(){const o=active();guardDraft(o);openDialog('item',formHead('Record existing item',`<p class="fine">For an item your order already owns, or an agreed table ruling — not an extra spoils roll. New battle loot comes through Spoils. Add this item to the stash, then use Move to in Armoury to equip a named knight.</p><label>Item<select name="def" required>${opts(D.equipment.filter(e=>e.table).map(e=>({id:e.id,name:title(e.group)+' · '+e.name})), '')}</select></label><label style="margin-top:14px">Source / reason<textarea name="reason" required></textarea></label>`,'Add to stash'));}
function recordChange(o,k,before,text){o.revision++;C.event(o,text);Object.assign(o.chronicle.at(-1),{before,after:C.clone(k)});}
function submitDialog(form){const f=new FormData(form),m=modal;
 if(m.type==='new'){submitNewOrder(form);return;}
 if(m.type==='order')updateOrder(o=>{guardDraft(o);o.name=String(f.get('name')).trim();o.player=String(f.get('player'));o.renownTarget=Number(f.get('target'));C.validateOrder(o);o.revision++;C.event(o,'Order details updated.');});
 if(m.type==='model')updateOrder(o=>{guardDraft(o);const k=o.models.find(k=>k.id===m.id),before=C.clone(k);k.label=String(f.get('label')).trim();if(k.named)k.name=String(f.get('name')).trim();else{k.kit={weapon:f.get('weapon'),shield:f.get('shield')||'',armour:f.get('armour')};}
  k.notes=String(f.get('notes'));k.play.damage=Number(f.get('damage'));k.play.momentum=Number(f.get('momentum'));for(const s of ['bravery','strength','destiny'])k.play.spent[s]=Number(f.get('spent-'+s));
  C.validateOrder(o);recordChange(o,k,before,'Updated '+C.label(k)+': identity, kit, notes or tabletop marks.');});
 if(m.type==='catchup')updateOrder(o=>{guardDraft(o);const k=o.models.find(k=>k.id===(m.id||f.get('model')));if(!k)throw new Error('Choose a model.');const before=C.clone(k);if(!String(f.get('reason')).trim()||f.get('confirm')!=='on')throw new Error('Explain and confirm the manual state.');
  k.named=true;k.name=String(f.get('name')).trim();k.xp=Number(f.get('xp'));k.stats=Object.fromEntries(R.STATS.map(s=>[s,Number(f.get('stat-'+s))]));k.abilityDice=Number(f.get('ability'));k.skills=f.getAll('skill');k.achievements=f.getAll('achievement');k.promotions=R.PROMOTIONS.filter(p=>k.xp>=p.xp).map(p=>p.xp);
  if(!k.name||o.models.filter(k=>k.named&&k.status==='active').length>12)throw new Error('A name is required and the active named register is limited to twelve.');C.validateOrder(o);recordChange(o,k,before,'Manually recorded '+k.name+': '+String(f.get('reason')).trim());});
 if(m.type==='item')updateOrder(o=>{guardDraft(o);const def=f.get('def');if(!D.byId[def]?.table||!String(f.get('reason')).trim())throw new Error('Choose an item and explain its source.');o.equipment.push({id:C.id('item'),def,owner:null,status:'stored',acquiredIn:'manual'});o.revision++;C.event(o,'Recorded '+D.byId[def].name+' in stash: '+String(f.get('reason')).trim());});
 if(m.type==='print'){printOptions={rules:f.get('rules')==='on',blank:f.get('blank')==='on',trackers:f.get('trackers')==='on'};closeDialog();openPrint();return;}
 closeDialog();render();
}
function action(name,el){const o=active();switch(name){
 case 'new-order':openNew();break;case 'edit-order':if(o)openOrder();break;case 'close-dialog':closeDialog();break;
 case 'generate-order':generateOrder();break;
 case 'import':$('#import-file').value='';$('#import-file').click();break;
 case 'export':download('greathelm-register.json',JSON.stringify({game:'greathelm-register',schema:1,version:VERSION,exportedAt:new Date().toISOString(),...(o&&!blocked?{order:o}:{orders:lib.orders})},null,2));break;
 case 'raw-backup':download('greathelm-stored-recovery.json',rawBackup||lastRaw||'{}');break;
 case 'retry-save':{if(blockKind!=='write')throw new Error('Export this copy and reload; do not overwrite another tab or an unreadable library.');blocked='';blockKind='';store(lib);render();break;}
 case 'add-model':updateOrder(o=>{guardDraft(o);if(o.models.length>=100)throw new Error('This library supports up to 100 model records per order.');o.models.push(C.model(o.models.length+1));o.revision++;C.event(o,'Added an unnamed model.');});break;
 case 'start-battle':updateOrder(o=>{o.draft=C.createDraft(o);o.draft.result='';o.draft.role='';o.draft.spoils=[];o.draft.feast.choice='';defaults(o.draft,o);},false);navigate('aftermath');break;
 case 'resume-battle':navigate('aftermath');break;
 case 'discard-battle':if(confirm('Discard this unfinished aftermath? The committed register is unchanged.')){updateOrder(o=>{o.draft=null;o.revision++;C.event(o,'Discarded an unfinished battle draft; no rewards applied.');},false);navigate('order');}break;
 case 'add-scene':withDraft(d=>{if(d.scenes.length>=30)throw new Error('At most 30 scenes per battle.');d.scenes.push({id:C.id('scene'),name:'Scene '+(d.scenes.length+1),deployed:[],removed:[],slain:[]});recheck(d);});break;
 case 'remove-scene':if(confirm('Remove this scene and its participation/casualty marks?'))withDraft(d=>{d.scenes.splice(Number(el.dataset.index),1);recheck(d);});break;
 case 'commit-battle':{const p=C.projectBattle(o);if(p.issues.length)throw new Error('Resolve all review issues first.');if(confirm('Apply this complete aftermath to the register? XP, loot, losses and naming will be recorded together.')){updateOrder(C.commitBattle,false);navigate('chronicle');toast('Battle recorded. Naming, XP and item destinations applied.');}break;}
 case 'reopen-battle':if(confirm('Reverse the latest battle and reopen its decisions? Its original history remains marked as reversed.')){updateOrder(C.reopenBattle,false);navigate('aftermath');}break;
 case 'catchup':if(o)catchup();break;case 'correct-model':catchup(el.dataset.id);break;
 case 'add-item':addItemDialog();break;
 case 'consume':if(confirm('Mark this consumable as used? Resolve its actual effect at the table.'))updateOrder(o=>C.consume(o,el.dataset.id));break;
 case 'retire':{const k=o.models.find(k=>k.id===el.dataset.id);if(confirm('Retire '+C.label(k)+' from the active register? Its record is retained.')){updateOrder(o=>{guardDraft(o);const k=o.models.find(k=>k.id===el.dataset.id),before=C.clone(k);k.status='retired';recordChange(o,k,before,'Retired '+C.label(k)+' from the active register.');});closeDialog();}break;}
 case 'rescue':{const reason=prompt('Record the scenario/ruling that returned this captured knight. No XP or achievement is automatically added.');if(reason?.trim()){updateOrder(o=>{guardDraft(o);const k=o.models.find(k=>k.id===el.dataset.id),before=C.clone(k);if(k.status!=='captured')throw new Error('This knight is not captured.');if(o.models.filter(k=>k.named&&k.status==='active').length>=12)throw new Error('The active named register is full.');k.status='active';recordChange(o,k,before,'Rescued '+C.label(k)+': '+reason.trim());});closeDialog();}break;}
 case 'achievement-tables':T.selectAchievements();navigate('tables');T.preview();break;
 case 'print':if(view==='play'){T.selectPlay();T.preview();break;}if(view==='tables'){T.preview();break;}if(view==='achievements'){T.selectAchievements();navigate('tables');T.preview();break;}if(o)openDialog('print',formHead('Print records',`<p class="fine">Prints the committed active register, stash and absent-name list, never an unfinished aftermath. Full archived records remain in the JSON export. Blank sheets omit all personal names, notes and selected equipment. Nothing changes in your saved order.</p><label class="check"><input name="rules" type="checkbox" ${printOptions.rules?'checked':''}>Include equipment / skill descriptions and campaign tables</label><label class="check"><input name="trackers" type="checkbox" ${printOptions.trackers?'checked':''}>Include current tabletop marks</label><label class="check"><input name="blank" type="checkbox" ${printOptions.blank?'checked':''}>Entirely blank forms for pencil</label>`,'Preview records'));else toast('Create an order first.');break;
 case 'close-print':document.body.classList.remove('preview-open');$('#print-controls').hidden=true;break;
 case 'do-print':window.print();break;
 }}
function printSection(name,body){return `<section class="print-section"><table><thead><tr><th><span class="print-heading-ornament" aria-hidden="true"><svg viewBox="0 0 30 24"><path d="M2 21C9 6 20 18 28 3M7 14C-2 13 2 3 7 7c3 2 1 6 0 7Zm7-2c-6-8 3-14 5-8 1 4-3 7-5 8Zm2 1c8-4 12 2 6 4-4 1-6-2-6-4Z" fill="none" stroke="currentColor"/></svg></span>${name}</th></tr></thead><tbody><tr><td>${body}</td></tr></tbody></table></section>`;}
function printHTML(o,options){const blank=options.blank,models=blank?Array.from({length:6},()=>null):o.models.filter(k=>k.status==='active');
 const records=models.map((k,i)=>`<article class="record">${blankShield('print-heraldry')}<h3>${blank?'Name: ____________':h(C.label(k))}</h3><p>${blank?'Rank: __________  XP: ________':k.named?`${currentRank(k)} · XP ${k.xp} · Ability dice ${k.abilityDice}`:'Unnamed knight · not yet discovered'}</p><div class="stat-strip">${R.STATS.map(s=>`<span><small>${s.toUpperCase()}</small>${blank||!k.named?'___':k.stats[s]}</span>`).join('')}</div><p>${blank?'Weapons / shield / armor: ______________':h(kitText(k,o))}</p><p>${blank?'Items: __________________________':'Items: '+h(o.equipment.filter(e=>e.owner===k.id&&e.status==='carried').map(e=>D.byId[e.def].name).join('; ')||'—')}</p><p>${blank?'Skills: __________________________':'Skills: '+h(k.skills.map(title).join(', ')||'—')}</p><p><span class="print-field">${blank?'Damage limit: ____':'Damage limit: '+(3+k.stats.endurance)}</span> · <span class="print-field">Damage: ${!blank&&options.trackers?k.play.damage:'____'}</span> · <span class="print-field">Momentum: ${!blank&&options.trackers?k.play.momentum:'____'}</span></p><p>Spent B / S / D: ${!blank&&options.trackers?`${k.play.spent.bravery} / ${k.play.spent.strength} / ${k.play.spent.destiny}`:'____ / ____ / ____'}</p>${!blank&&k.achievements.length?`<p>Deeds: ${h(k.achievements.map(a=>D.deedById[a].name).join(', '))}</p>`:''}${!blank&&k.injuries.length?`<p>Injuries: ${h(k.injuries.map(i=>title(i.kind)).join(', '))}</p>`:''}${!blank&&k.notes?`<p>${k.notes.length>600?'Extended notes: see Model notes, record '+(i+1)+'.':h(k.notes)}</p>`:''}<p>Notes / conditions:</p><div class="writing-line"></div><div class="writing-line"></div></article>`).join('');
 let html=printSection('Greathelm',`<div class="print-meta">${blank?'Order: ____________________  Chronicler: ____________________':`${h(o.name)} · ${h(o.player)}<br>Renown: ${C.renown(o)} / ${o.renownTarget} · ${o.battles.filter(b=>!b.reverted).length} battles · Rules 0.4.0`}</div><div class="records-grid">${records}</div>`);
 if(!blank&&models.some(k=>k.notes.length>600))html+=printSection('MODEL NOTES',models.map((k,i)=>k.notes.length>600?`<div class="print-long-note"><h3>${i+1}. ${h(C.label(k))} · ${h(k.label)}</h3><p>${h(k.notes)}</p></div>`:'').join(''));
 if(!blank)html+=printSection('ORDER RECORD',`<h3>Stored equipment</h3>${o.equipment.filter(e=>e.status==='stored').map(e=>`<p>${h(D.byId[e.def].name)}</p>`).join('')||'<p>None recorded.</p>'}<h3>Absent knights</h3>${o.models.filter(k=>k.status!=='active').map(k=>`<p>${h(C.label(k))} · ${h(k.status)} · ${k.xp} XP</p>`).join('')||'<p>None recorded.</p>'}<h3>Applied battles</h3>${o.battles.filter(b=>!b.reverted).map(b=>`<div class="print-reference"><h3>${h(b.scenario)}</h3><p>${h(b.changes.join('\n'))}</p>${b.draft.notes?`<p>${h(b.draft.notes)}</p>`:''}</div>`).join('')||'<p>No battles recorded.</p>'}<p>Renown convention: ${o.settings.renown==='per-knight'?'one per active named knight with Tier 2':'one per Tier 2 on active knights'}. Other provisional conventions are recorded in the digital register.</p><div class="writing-line"></div><div class="writing-line"></div>`);
 if(options.rules){
  if(!blank){const used=new Set();for(const k of models){kitIds(k,o).forEach(id=>used.add(id));o.equipment.filter(e=>e.owner===k.id&&e.status==='carried').forEach(e=>used.add(e.def));}
   o.equipment.filter(e=>e.status==='stored').forEach(e=>used.add(e.def));
   html+=printSection('EQUIPMENT', [...used].map(id=>{const d=D.byId[id];return `<div class="print-reference"><h3>${h(d.name)}</h3><p>${h(d.text)}</p>${source(d.page)}</div>`;}).join('')+`<div class="print-reference"><h3>Armor table · d6 (p.24)</h3><p>1 — Pierced: apply attack damage plus 1.\n2–5 — Struck: apply attack damage.\n6 — Impervious: no damage applied.\nItem and armor rules modify these outcomes. A knight reaching its damage limit is removed; if the limit is met or exceeded when Pierced, it is gruesomely slain.</p></div><div class="print-reference"><h3>Consumables and markers</h3><p>Tossed items use a 25 mm marker placed on ground or elevated terrain within range and line of sight. Follow the item’s removal instruction; remaining tossed markers end with the turn. Buff markers last until their effect is used. Resolve all effects at the table.</p>${source(44)}</div>`);
   const skills=new Set(models.flatMap(k=>k.skills)),deeds=new Set(models.flatMap(k=>k.achievements));
   html+=printSection('KNIGHT RULES',`<div class="print-reference"><h3>Stat points</h3><p>Endurance: each point raises the damage limit by one. Agility: each point adds one inch to move-action distance. Spend Bravery to automatically pass a courage test; Strength before an attack for +1 damage per point; Destiny for +1 per point on armor or post-battle survival rolls. Active points restore between games, after resolving survival under the agreed convention.</p>${source(105)}</div><div class="print-reference"><h3>Ability dice</h3><p>Add each knight’s ability die at initiative; only its owner may use it. Roll it with initiative, or set it for Bash (4), Fast Attack (2), or Heavy Attack (1).</p>${source(107)}</div>${[...skills].map(s=>`<div class="print-reference"><h3>${title(s)}</h3><p>${h(D.skillText[s])}</p>${source(107)}</div>`).join('')}${[...deeds].map(id=>{const d=D.deedById[id];return `<div class="print-reference"><h3>${h(d.name)}</h3><p>${h(d.text)}${d.prerequisite?' Requires '+h(D.deedById[d.prerequisite].name)+'.':''}${d.stat?' Grants +1 '+d.stat+' (cap/ruling applies).':''}</p>${source(d.page)}</div>`;}).join('')}`);
  }
  html+=printSection('CAMPAIGN TABLES',`<div class="print-reference"><h3>After the battle</h3><ol><li>Resolve spoils, then missing named knights.</li><li>Hold a feast: name at most one eligible achiever; distribute three points, at most two per stat.</li><li>Award XP, resolve promotions, distribute equipment.</li></ol>${source(113)}</div><table><thead><tr><th>Spoils d6</th><th>Result</th></tr></thead><tbody><tr><td>1</td><td>Roll once on a consumable list.</td></tr><tr><td>2–4</td><td>Roll once on a worn or consumable list.</td></tr><tr><td>5</td><td>Roll once on a use, worn or upgrade list.</td></tr><tr><td>6</td><td>One roll in each of two families: consumable / worn / use / upgrades; OR one legendary list.</td></tr></tbody></table><p>Major victory: winner rolls twice, defeated once. Minor victory/defeat: once each. Source p.113.</p><table><thead><tr><th>Survival 2d6</th><th>Result</th></tr></thead><tbody><tr><td>2</td><td>Battle injury: use injury table.</td></tr><tr><td>3</td><td>Captured; removed from active register. Rescue is possible.</td></tr><tr><td>4–6</td><td>Lose a random item/consumable/upgrade. No eligible equipment: Survived.</td></tr><tr><td>7–11</td><td>Survived.</td></tr><tr><td>12</td><td>Battlefield Lesson: +1 XP.</td></tr></tbody></table><p>Only named knights removed but not gruesomely slain roll. Source p.114.</p><table><thead><tr><th>Injury result</th><th>Effect</th></tr></thead><tbody><tr><td>1</td><td>Head Wound: lose a random Endurance, Agility or Strength point.</td></tr><tr><td>2–3</td><td>Broken Body: lose a random skill or ability die.</td></tr><tr><td>4+</td><td>Lasting Injury: no XP from this battle.</td></tr></tbody></table><p>Injury d6 is a provisional convention; zero-loss pools and survival totals over 12 require a recorded ruling. Source p.114.</p><div class="print-reference"><h3>Experience and promotions</h3><p>+1 XP per scene appeared in; scenario bonuses as stated; +1 total for inflicting any gruesome deaths; +1 for Battlefield Lesson. Newly named knights and knights with Lasting Injury earn no XP from that battle. At 3 / 7 / 12 XP become Veteran / Master / Lord: each promotion grants one stat point and one skill OR one ability die. No stat above three. XP is not spent. Source p.116.</p></div><p>These are campaign references, not a replacement for combat/scenario rules. Consult the Greathelm 0.4.0 book and your recorded playtest rulings.</p>`);
 }
 return html;
}

function promotion(d,id,threshold){const list=d.promotions[id]||=[];let c=list.find(c=>c.threshold===threshold);if(!c){c={threshold,stat:'',reward:{kind:'',skill:''},origin:'chosen'};list.push(c);}return c;}
function handleClick(e){const el=e.target.closest('button,a[data-view]');if(!el||el.disabled)return;
 if(el.dataset.flowScope){W.focus(active().draft,el.dataset.flowScope,el.dataset.flowKey);render();document.getElementById('aftermath-step')?.scrollIntoView({block:'start'});return;}
 if(el.hasAttribute('data-use-model-label')){withDraft((d,o)=>{const k=o.models.find(k=>k.id===d.feast.modelId);if(k)d.feast.name=k.label;});return;}
 if(el.dataset.action){action(el.dataset.action,el);return;}
 if(el.dataset.view){navigate(el.dataset.view);return;}
 if(el.dataset.achievementFor){achievementModelId=el.dataset.achievementFor;achievementQuery='';navigate('achievements');return;}
 if(el.hasAttribute('data-ach-return')){navigate('aftermath');return;}
 if(el.dataset.achAward){const o=active(),a=D.deedById[el.dataset.achAward];if(!a||!A.state(o,achievementModelId,a,C.projectBattle(o)).canRecord)throw new Error('This feat is not currently eligible.');withDraft(d=>{d.facts[achievementModelId].deeds.push(a.id);recheck(d,[achievementModelId]);});toast('Feat added to the aftermath draft — not yet applied.');return;}
 if(el.dataset.achRemove){const id=el.dataset.achRemove,d=active().draft,dependents=C.fact(d,achievementModelId).deeds.filter(a=>D.deedById[a].prerequisite===id);if(dependents.length&&!confirm('Also remove the dependent draft achievement(s): '+dependents.map(a=>D.deedById[a].name).join(', ')+'?'))return;withDraft(d=>{const f=d.facts[achievementModelId];f.deeds=f.deeds.filter(a=>a!==id&&!dependents.includes(a));[id,...dependents].forEach(a=>delete f.overflow[a]);recheck(d,[achievementModelId]);});return;}
 if(el.hasAttribute('data-ach-name')){withDraft((d,o)=>{const k=o.models.find(k=>k.id===achievementModelId);if(!k||k.named||!C.attendance(d,k.id)||!C.fact(d,k.id).deeds.length)throw new Error('Choose an unnamed participant with a witnessed deed.');if(d.feast.modelId!==k.id){d.feast.modelId=k.id;clearDependent(d,'feast.modelId');}d.feast.choice='yes';d.step=3;},false);navigate('aftermath');return;}
 if(el.dataset.nameTitle){withDraft(d=>{if(!C.fact(d,d.feast.modelId).deeds.includes(el.dataset.nameTitle))throw new Error('Record this deed first.');if(!d.feast.name.trim())throw new Error('Enter a personal name first; titles are not a list of personal names.');d.feast.name=A.styledName(d.feast.name,d.feast.styledWith,el.dataset.nameTitle);d.feast.styledWith=el.dataset.nameTitle;});return;}
 if(el.dataset.model){profile(el.dataset.model);return;}
 if(el.dataset.step!==undefined){withDraft(d=>{d.step=Number(el.dataset.step);});window.scrollTo({top:120,behavior:'instant'});return;}
 if(el.dataset.mode){if(get(active().draft,el.dataset.mode)?.mode===el.dataset.value)return;withDraft(d=>{set(d,el.dataset.mode,{...C.decision(),mode:el.dataset.value,value:el.dataset.value==='dice'?null:''});clearDependent(d,el.dataset.mode);});return;}
 if(el.dataset.survivalMode){if(active().draft.missing[el.dataset.survivalMode]?.mode===el.dataset.value)return;withDraft(d=>{d.missing[el.dataset.survivalMode]=newMissing();d.missing[el.dataset.survivalMode].mode=el.dataset.value;recheck(d,[el.dataset.survivalMode]);});return;}
 if(el.dataset.planRemove!==undefined){withDraft(d=>{d.equipmentMoves.splice(Number(el.dataset.planRemove),1);for(const move of d.equipmentMoves)move.needsReview=true;});return;}
 if(el.dataset.planReview!==undefined){withDraft(d=>{d.equipmentMoves[Number(el.dataset.planReview)].needsReview=false;});return;}
 if(el.dataset.removeDeed){const d=active().draft,f=C.fact(d,el.dataset.removeDeed),dependents=f.deeds.filter(id=>D.deedById[id].prerequisite===el.dataset.deed);if(dependents.length&&!confirm('Also remove dependent draft achievements?'))return;withDraft(d=>{const f=d.facts[el.dataset.removeDeed];f.deeds=f.deeds.filter(x=>x!==el.dataset.deed&&!dependents.includes(x));[el.dataset.deed,...dependents].forEach(id=>delete f.overflow[id]);recheck(d,[el.dataset.removeDeed]);});return;}
}
document.addEventListener('click',e=>{try{handleClick(e);}catch(error){toast(error.message);render();}});
function updateDraftInput(el,draw){const path=el.dataset.draft;W.remember(active().draft,path);let value=el.type==='number'||el.dataset.number?el.value===''?null:Number(el.value):el.value;
 withDraft(d=>{set(d,path,value);if(/^missing\.[^.]+\.dice\.\d+\.value$/.test(path))set(d,path.replace(/\.value$/,'.origin'),'entered');clearDependent(d,path);},draw);
 if(path==='feast.name'&&$('#naming-summary'))$('#naming-summary').innerHTML=`<strong>After confirmation:</strong> ${h(active().draft.feast.name||'This knight')} becomes a named Novitiate, with three starting stat points and <strong>0 XP from this battle</strong>.`;
 if(path.startsWith('feast.stats.')&&$('#allocation-count'))$('#allocation-count').textContent=Object.values(active().draft.feast.stats).reduce((n,v)=>n+Number(v||0),0)+'/3 allocated.';
}
document.addEventListener('input',e=>{const el=e.target;if(!el.matches('input,textarea'))return;try{
 if(isOrderSetup(el)){orderSetup=readOrderSetup(el.closest('form'));return;}
 if(el.id==='achievement-search'){achievementQuery=el.value;render();return;}
 if(el.dataset.draft)updateDraftInput(el,el.type==='number'&&el.dataset.draft.startsWith('missing.'));
 if(el.dataset.decision&&el.dataset.kind==='dice')withDraft(d=>{const dec=get(d,el.dataset.decision);dec.value=el.value===''?null:Number(el.value);dec.origin='entered';clearDependent(d,el.dataset.decision);},true);
}catch(error){toast(error.message);}});
document.addEventListener('change',e=>{const el=e.target;try{
 if(isOrderSetup(el)){const form=el.closest('form');orderSetup=readOrderSetup(form);if(el.dataset.setupKit!==undefined)updateSetupKit(Number(el.dataset.setupKit),form);return;}
 if(el.id==='achievement-model'){achievementModelId=el.value;render();return;}
 if(el.id==='order-switch'){change(l=>l.active=el.value,false);closeDialog();navigate('order');return;}
 if(el.hasAttribute('data-feast-choice')){const d=active().draft;if(el.value!=='yes'&&d.feast.modelId&&!confirm('Remove this draft naming and its starting stat allocation? Recorded achievements stay.')){render();return;}withDraft(d=>{d.feast.choice=el.value;if(el.value!=='yes'){d.feast.modelId='';clearDependent(d,'feast.modelId');}else clearDependent(d,'feast.choice');});return;}
 if(el.dataset.bonusReason){const d=active().draft,id=el.dataset.bonusReason,old=C.fact(d,id).scenarioNote;if(el.value==='custom'){W.focus(d,'bonus-'+id,'custom');render();return;}const preset=W.bonusOptions.find(b=>b.id===el.value);if(el.value&&!preset)throw new Error('Unknown scenario bonus reason.');const note=preset?.note||'';if(old&&old!==note&&!W.bonusOptions.some(b=>b.note===old)&&!confirm('Replace the existing explanation with the selected reason? The XP amount will not change.')){render();return;}W.focus(d,'bonus-'+id,'preset');if(old===note){render();return;}withDraft(d=>{d.facts[id].scenarioNote=note;clearDependent(d,`facts.${id}.scenarioNote`);});return;}
 if(el.dataset.draft){if(el.tagName==='SELECT')updateDraftInput(el,true);return;}
 if(el.dataset.decision&&el.tagName==='SELECT'){changeDecision(el.dataset.decision,el.dataset.kind==='dice'?(el.value===''?null:Number(el.value)):el.value,el.dataset.kind,el.dataset.kind==='dice'?'entered':'chosen');return;}
 if(el.dataset.deploy!==undefined){withDraft(d=>{const s=d.scenes[Number(el.dataset.deploy)],key=el.dataset.id;if(el.checked){if(!s.deployed.includes(key))s.deployed.push(key);}else{s.deployed=s.deployed.filter(x=>x!==key);s.removed=s.removed.filter(x=>x!==key);s.slain=s.slain.filter(x=>x!==key);}recheck(d,[key]);});return;}
 if(el.dataset.casualty!==undefined){withDraft(d=>{const s=d.scenes[Number(el.dataset.casualty)],key=el.dataset.id;s.removed=s.removed.filter(x=>x!==key);s.slain=s.slain.filter(x=>x!==key);if(el.value==='removed')s.removed.push(key);if(el.value==='slain')s.slain.push(key);recheck(d,[key]);});return;}
 if(el.dataset.lootTable!==undefined){W.focus(active().draft,'spoils',el.dataset.lootTable);withDraft(d=>{d.spoils[Number(el.dataset.lootTable)].picks[Number(el.dataset.pick)]={table:el.value,roll:C.decision('dice')};for(const move of d.equipmentMoves||[])move.needsReview=true;});return;}
 if(el.dataset.loss){W.focus(active().draft,'missing',el.dataset.loss);withDraft((d,o)=>{const key=el.dataset.loss,k=o.models.find(k=>k.id===key),r=C.resolveMissing(o,k,d.missing[key]),pool=C.losses(o,k,r.injury||'lost-equipment').map(c=>c.id);d.missing[key].loss={id:el.value,origin:el.value?'entered':null,index:pool.indexOf(el.value)+1,pool};recheck(d,[key]);});return;}
 if(el.dataset.addDeed&&el.value){if(!A.state(active(),el.dataset.addDeed,D.deedById[el.value],C.projectBattle(active())).canRecord)throw new Error('This achievement is not currently eligible.');withDraft(d=>{const f=d.facts[el.dataset.addDeed];if(!f.deeds.includes(el.value))f.deeds.push(el.value);recheck(d,[el.dataset.addDeed]);});return;}
 if(el.dataset.promotionReview){withDraft(d=>{const c=promotion(d,el.dataset.promotionReview,Number(el.dataset.threshold));c.needsReview=false;});return;}
 if(el.dataset.promotion){withDraft(d=>{const c=promotion(d,el.dataset.promotion,Number(el.dataset.threshold));if(el.dataset.part==='stat')c.stat=el.value;else c.reward=el.value==='ability-die'?{kind:'ability-die'}:{kind:'skill',skill:el.value};c.origin='chosen';c.needsReview=false;});return;}
 if(el.dataset.planItem){withDraft((d,o)=>{const p=C.projectBattle(o);if(p.issues.some(e=>e.step<4))throw new Error('Resolve the earlier steps first.');const item=p.after.equipment.find(e=>e.id===el.dataset.planItem),owner=el.value||null;if(!item)throw new Error('This item changed; review the earlier choices.');if(item.owner===owner)return;C.transferEquipment(p.after,item.id,owner);(d.equipmentMoves||=[]).push({itemId:item.id,def:item.def,fromOwner:item.owner,owner,needsReview:false});});toast('Equipment transfer planned — applied only at final confirmation.');return;}
 if(el.dataset.equip){if(confirm('Move this equipment to '+(el.value?'the selected knight':'the stash')+'?'))updateOrder(o=>C.equip(o,el.dataset.equip,el.value||null));else render();return;}
 if(modal?.type==='model'&&['weapon','shield','armour'].includes(el.name))updateKitPreview();
}catch(error){toast(error.message);render();}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>8*1024*1024)throw new Error('Import limit is 8 MB.');const orders=C.importOrders(await file.text());if(!confirm(`Import ${orders.length} order(s) as new copies? Existing orders remain unchanged.`))return;change(l=>{if(l.orders.length+orders.length>30)throw new Error('Library limit: 30 orders. Export a backup first.');l.orders.push(...orders);l.active=orders[0].id;},false);navigate('order');toast('Imported as a new copy.');}catch(error){toast(error.message);}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==lastRaw){rawBackup=e.newValue||'';blockKind='conflict';blocked='Another tab changed the library. Export this copy and reload before continuing.';saveMeta();}});
window.addEventListener('beforeunload',e=>{if(blocked){e.preventDefault();e.returnValue='';}});
window.addEventListener('hashchange',()=>{const target=location.hash.slice(1);if(['order','aftermath','armoury','chronicle','rules','tables','achievements','play'].includes(target)){view=target;render();}});
const initial=location.hash.slice(1);if(['order','aftermath','armoury','chronicle','rules','tables','achievements','play'].includes(initial))view=initial;render();
})();
</script></body></html>
